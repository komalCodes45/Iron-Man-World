!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iron Man Movies</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#000;
    color:white;
}

h1{
    text-align:center;
    color:red;
    margin:30px;
}

.container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:30px;
}
.card img{
    width: 200px;
    height: 250px;
    object-fit: cover;
    border-radius: 10px;
    display: block;
    margin: auto;
}
.card{
    background:#111;
    border:2px solid red;
    border-radius:15px;
    padding:20px;
    transition:.4s;
}

.card:hover{
    transform:translateY(-10px);
    box-shadow:0 0 20px red;
}

.card h2{
    color:#ff3b3b;
}

.card p{
    color:#ddd;
}

a{
    color:white;
    text-decoration:none;
}
</style>

</head>
